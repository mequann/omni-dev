name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - run: dotnet restore
    - run: dotnet test -c Release

  build-executables:
    name: Build Standalone Binaries (${{ matrix.target.name }})
    needs: test
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            binary: omni.exe
            archive: omni-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            binary: omni
            archive: omni-linux-x64.tar.gz
          - name: macos-arm64
            os: macos-latest
            rid: osx-arm64
            binary: omni
            archive: omni-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-latest
            rid: osx-x64
            binary: omni
            archive: omni-macos-x64.tar.gz

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Publish Self-Contained Binary
      run: >
        dotnet publish src/Omni.Cli
        -c Release
        -r ${{ matrix.target.rid }}
        -f net9.0
        --self-contained true
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -o publish

    - name: Inspect & Ensure Binary Name (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-ChildItem publish
        if (Test-Path publish/Omni.Cli.exe) {
          Move-Item publish/Omni.Cli.exe publish/omni.exe -Force
        }

    - name: Inspect & Ensure Binary Name (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -la publish/
        if [ -f publish/Omni.Cli ]; then
          mv publish/Omni.Cli publish/omni
        fi
        chmod +x publish/omni

    - name: Archive Binary (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path publish/${{ matrix.target.binary }} -DestinationPath ${{ matrix.target.archive }}

    - name: Archive Binary (macOS/Linux)
      if: runner.os != 'Windows'
      run: tar -czf ${{ matrix.target.archive }} -C publish ${{ matrix.target.binary }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target.name }}
        path: ${{ matrix.target.archive }}

  publish-nuget-and-release:
    name: Create GitHub Release & Publish NuGet
    needs: build-executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Download all built binaries
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        merge-multiple: true

    - name: Pack NuGet Tool
      run: dotnet pack src/Omni.Cli -c Release -o nupkg-out

    - name: NuGet Login via OIDC (Trusted Publishing)
      id: nuget-login
      continue-on-error: true
      uses: NuGet/login@v1

    - name: Publish to NuGet.org (Trusted Publishing)
      if: steps.nuget-login.outcome == 'success'
      run: dotnet nuget push nupkg-out/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Fallback Publish to NuGet.org (API Key if set)
      if: steps.nuget-login.outcome != 'success' && env.NUGET_API_KEY != ''
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push nupkg-out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/*
          nupkg-out/*.nupkg
        generate_release_notes: true
